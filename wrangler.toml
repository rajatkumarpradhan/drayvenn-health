name = "drayvenn-health"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "drayvenn-health-db"
database_id = "9ef176b1-d282-4a5e-83d6-2aacc1be0d20"
# Isolated demo DB for preview deployments. NOTE: wrangler pages deploy ignores
# preview_database_id (and clobbers dashboard preview bindings), so functions/api/_middleware.js
# swaps DB -> DB_PREVIEW for any non-production host.

migrations_dir = "migrations"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB_PREVIEW"
database_name = "drayvenn-health-db-preview"
database_id = "f4515ae6-ae9f-4b6f-8b98-b362facbfe38"
